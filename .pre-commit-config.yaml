repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        name: ruff lint
        args: [--fix]
      - id: ruff-format
        name: ruff format
        args: []
  
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.1
    hooks:
      - id: cspell
        name: cspell
        args: [--no-progress]
        files: \.(py|md)$
        exclude: ^(\.venv|__pycache__|build|dist|\.memories|sandbox)/
